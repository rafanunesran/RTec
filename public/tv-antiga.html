<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>RTec TV</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0b10; color: #f4f4f6; font-family: Arial, Helvetica, sans-serif; font-size: 26px; overflow: hidden; }
  #app { position: absolute; left: 0; top: 0; right: 0; bottom: 0; padding: 30px 50px; overflow: hidden; }
  h1 { font-size: 40px; margin: 0 0 6px; }
  h1 span { color: #38bdf8; }
  .sub { color: #9a9aa6; font-size: 22px; margin: 0 0 20px; }
  .list { position: absolute; left: 50px; right: 50px; top: 130px; bottom: 60px; overflow: hidden; }
  .f { display: block; padding: 14px 22px; margin: 0 0 8px; border-radius: 10px; background: #18181f; color: #e4e4ea; text-decoration: none; border: 3px solid #18181f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f.on, .f:focus { background: #f4f4f6; color: #0b0b10; border-color: #38bdf8; outline: none; }
  .f.big { font-size: 34px; padding: 22px 28px; }
  .muted { color: #9a9aa6; }
  .err { color: #f87171; }
  .ok { color: #4ade80; }
  .hint { position: absolute; left: 50px; right: 50px; bottom: 16px; color: #6b6b78; font-size: 20px; }
  input.f { width: 600px; font-size: 28px; font-family: Arial, Helvetica, sans-serif; }
  label { display: block; color: #9a9aa6; font-size: 22px; margin: 14px 0 6px; }
  #player { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: #000; }
  #player video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; }
  #osd { position: absolute; left: 0; right: 0; top: 0; padding: 24px 40px; background: rgba(0,0,0,0.7); font-size: 30px; }
  #osd small { display: block; color: #b8b8c4; font-size: 22px; margin-top: 6px; }
  #perr { display: none; position: absolute; left: 15%; right: 15%; top: 25%; padding: 30px; background: #18181f; border-radius: 16px; text-align: center; }
  #perr .f { text-align: left; }
  table { border-collapse: collapse; }
  td { padding: 4px 20px 4px 0; vertical-align: top; font-size: 20px; }
</style>
</head>
<body>
<div id="app"><h1>R<span>Tec</span></h1><p class="sub">Carregando...</p></div>
<div id="player">
  <video id="v"></video>
  <div id="osd"></div>
  <div id="perr"></div>
</div>
<script>
// RTec leve: para TVs e navegadores antigos (Samsung Smart Hub/Orsay de 2011 a 2016 e outros) que nao
// rodam o site normal. O index.html manda para ca quem nao tem suporte a modulos JavaScript.
// Escrito em JavaScript antigo de proposito (sem let, const, arrow, Promise ou fetch).
// O video toca no reprodutor da propria TV, com o link direto do fornecedor (?direct=1 na API).
(function () {
  var app = document.getElementById("app");
  var player = document.getElementById("player");
  var video = document.getElementById("v");
  var osd = document.getElementById("osd");
  var perr = document.getElementById("perr");
  var PAGE = 40;
  var ADULT = /(adult|xxx|\+18|18\+|adulto|er[oó]tic|hot\b|sexy|porn)/i;

  // ---------- utilidades ----------
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function parse(t) { try { return window.JSON ? JSON.parse(t) : eval("(" + t + ")"); } catch (e) { return null; } }
  function api(method, url, body, done) {
    var x = new XMLHttpRequest();
    x.open(method, url + (url.indexOf("?") < 0 ? "?" : "&") + "direct=1", true);
    x.setRequestHeader("Accept", "application/json");
    if (body) x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var data = parse(x.responseText);
      if (x.status >= 200 && x.status < 300) done(null, data);
      else done({ status: x.status, message: (data && data.error) || ("Erro " + x.status) }, data);
    };
    x.send(body ? (window.JSON ? JSON.stringify(body) : "") : null);
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return null; }

  // ---------- telas (cada uma fica no endereco #..., o "voltar" da TV volta uma tela) ----------
  var state = { catalog: null, m3u: null, lists: {}, list: null, listTitle: "", index: 0 };

  function go(hash) { if (location.hash === "#" + hash) render(); else location.hash = hash; }
  function back() {
    if (player.style.display === "block") { stop(); return; }
    if (location.hash && location.hash !== "#" && location.hash !== "#home" && location.hash !== "#login") history.back();
  }
  window.onhashchange = function () { if (player.style.display === "block") stop(); else render(); };

  function view(title, sub, items, hint) {
    var h = '<h1>R<span>Tec</span> ' + (title ? "&middot; " + esc(title) : "") + '</h1><p class="sub">' + (sub || "") + '</p><div class="list" id="list">';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<a href="#" class="f' + (it.big ? " big" : "") + '" data-i="' + i + '">' + esc(it.label) + (it.extra ? ' <span class="muted">' + esc(it.extra) + "</span>" : "") + "</a>";
    }
    h += '</div><div class="hint">' + (hint || "Setas para escolher &middot; OK para abrir &middot; Voltar para sair") + "</div>";
    app.innerHTML = h;
    var links = app.getElementsByTagName("a");
    for (var j = 0; j < links.length; j++) {
      links[j].onclick = (function (it) { return function () { it.go(); return false; }; })(items[j]);
    }
    focusAt(state.focus && state.focus[location.hash] || 0);
  }

  function message(title, text, isErr) {
    app.innerHTML = '<h1>R<span>Tec</span> ' + (title ? "&middot; " + esc(title) : "") + '</h1><p class="sub ' + (isErr ? "err" : "") + '">' + text + '</p><div class="list"><a href="#" class="f" id="msgback">Voltar</a></div>';
    document.getElementById("msgback").onclick = function () { back(); return false; };
    focusAt(0);
  }

  // ---------- foco pelo controle ----------
  var focused = 0;
  state.focus = {};
  function focusables() {
    var out = [];
    var all = app.querySelectorAll ? app.querySelectorAll(".f") : app.getElementsByTagName("a");
    for (var i = 0; i < all.length; i++) out.push(all[i]);
    return out;
  }
  function focusAt(i) {
    var list = focusables();
    if (!list.length) return;
    if (i < 0) i = 0;
    if (i >= list.length) i = list.length - 1;
    for (var j = 0; j < list.length; j++) list[j].className = list[j].className.replace(/\s?\bon\b/g, "");
    var el = list[i];
    el.className += " on";
    focused = i;
    state.focus[location.hash] = i;
    try { el.focus(); } catch (e) {}
    // Rola a lista para o item escolhido ficar visivel.
    var box = document.getElementById("list");
    if (box && el.offsetTop !== undefined) {
      var top = el.offsetTop - box.offsetTop;
      if (top < box.scrollTop) box.scrollTop = top;
      else if (top + el.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = top + el.offsetHeight - box.clientHeight;
    }
  }

  // Codigos do controle: navegadores comuns + Samsung antiga (Orsay) + LG/Tizen.
  var K = {
    up: [38, 29460], down: [40, 29461], left: [37, 4], right: [39, 5], enter: [13, 29443],
    back: [8, 27, 88, 10009, 461, 166], chup: [33, 68, 427], chdown: [34, 65, 428],
    play: [415, 71, 179], pause: [19, 74], playpause: [10252]
  };
  function is(k, code) { for (var i = 0; i < K[k].length; i++) if (K[k][i] === code) return true; return false; }

  document.onkeydown = function (e) {
    e = e || window.event;
    var code = e.keyCode;
    var target = e.target || e.srcElement;
    var typing = target && target.tagName === "INPUT";
    if (player.style.display === "block") return playerKey(code, e);
    if (is("back", code)) {
      if (typing && code === 8) return true;
      if (typing) { target.blur(); return cancel(e); }
      back();
      return cancel(e);
    }
    if (is("up", code) || (is("left", code) && !typing)) { focusAt(focused - 1); return cancel(e); }
    if (is("down", code) || (is("right", code) && !typing)) { focusAt(focused + 1); return cancel(e); }
    if (is("enter", code)) {
      var el = focusables()[focused];
      if (!el) return true;
      if (el.tagName === "INPUT") { el.focus(); return true; } // abre o teclado da TV
      if (el.onclick) el.onclick();
      return cancel(e);
    }
    return true;
  };
  function cancel(e) { if (e.preventDefault) e.preventDefault(); e.returnValue = false; return false; }

  // ---------- login ----------
  function loginScreen(msg) {
    app.innerHTML = '<h1>R<span>Tec</span></h1><p class="sub' + (msg ? " err" : "") + '">' + (msg ? esc(msg) : "Entre com o usuario e a senha que voce recebeu.") + "</p>" +
      '<label>Usuario</label><input class="f" id="u" type="text" autocomplete="off">' +
      '<label>Senha</label><input class="f" id="p" type="password">' +
      '<a href="#" class="f big" id="go" style="width:300px;margin-top:24px">Entrar</a>' +
      '<div class="hint">Setas para escolher &middot; OK no campo para digitar</div>';
    document.getElementById("u").value = store("rtec:lite:user") || "";
    document.getElementById("go").onclick = function () {
      var u = document.getElementById("u").value, p = document.getElementById("p").value;
      if (!u || !p) return false;
      app.getElementsByTagName("p")[0].innerHTML = "Entrando...";
      api("POST", "/api/player/login", { username: u, password: p }, function (err) {
        if (err) return loginScreen(err.status === 401 ? "Usuario ou senha incorretos." : err.message);
        store("rtec:lite:user", u);
        state.catalog = null;
        go("home");
      });
      return false;
    };
    focusAt(document.getElementById("u").value ? 1 : 0);
  }

  // ---------- inicio ----------
  function home() {
    view("", "O que voce quer assistir?", [
      { label: "TV ao vivo", big: true, go: function () { go("cats/live"); } },
      { label: "Filmes", big: true, go: function () { go("cats/movie"); } },
      { label: "Series", big: true, go: function () { go("cats/series"); } },
      { label: "Informacoes da TV", go: function () { go("info"); } },
      { label: "Sair da conta", go: function () { api("POST", "/api/player/logout", {}, function () { state.catalog = null; go("login"); }); } }
    ], "Setas para escolher &middot; OK para abrir");
  }

  // Catalogo: no Xtream vem do fornecedor por categoria; nas listas M3U, tudo de uma vez.
  function loadCatalog(done) {
    if (state.catalog) return done();
    app.innerHTML = '<h1>R<span>Tec</span></h1><p class="sub">Carregando sua lista...</p>';
    api("GET", "/api/player/catalog", null, function (err, data) {
      if (err) return err.status === 401 ? go("login") : message("", "Nao foi possivel carregar sua lista. " + esc(err.message), true);
      state.catalog = data;
      if (data.mode === "xtream") return done();
      api("GET", "/api/player/channels", null, function (err2, d2) {
        if (err2) return message("", "Nao foi possivel carregar sua lista. " + esc(err2.message), true);
        state.m3u = (d2 && d2.channels) || [];
        done();
      });
    });
  }

  var SECTION = { live: "TV ao vivo", movie: "Filmes", series: "Series" };

  function categories(section) {
    loadCatalog(function () {
      var cats = [];
      if (state.catalog.mode === "xtream") {
        var src = (state.catalog.sections && state.catalog.sections[section]) || [];
        for (var i = 0; i < src.length; i++) if (!ADULT.test(src[i].name)) cats.push({ id: src[i].id, name: src[i].name });
      } else {
        var seen = {};
        for (var j = 0; j < state.m3u.length; j++) {
          var c = state.m3u[j];
          if (c.kind !== section || seen[c.group] || ADULT.test(c.group)) continue;
          seen[c.group] = 1;
          cats.push({ id: c.group, name: c.group });
        }
      }
      if (!cats.length) return message(SECTION[section], "Nada nesta secao.");
      var items = [];
      for (var k = 0; k < cats.length; k++) {
        items.push({ label: cats[k].name, go: (function (id) { return function () { go("items/" + section + "/" + encodeURIComponent(id)); }; })(cats[k].id) });
      }
      view(SECTION[section], cats.length + " categorias", items);
    });
  }

  function items(section, cat, page) {
    var key = section + "|" + cat;
    var show = function (list) {
      state.lists[key] = list;
      var title = cat;
      if (state.catalog && state.catalog.mode === "xtream") {
        var cs = state.catalog.sections[section] || [];
        for (var i = 0; i < cs.length; i++) if (cs[i].id === cat) title = cs[i].name;
      }
      if (!list.length) return message(title, "Nada nesta categoria.");
      var from = page * PAGE, out = [];
      if (page > 0) out.push({ label: "<< Anteriores", go: function () { go("items/" + section + "/" + encodeURIComponent(cat) + "/" + (page - 1)); } });
      for (var j = from; j < Math.min(list.length, from + PAGE); j++) {
        out.push({ label: list[j].name, go: (function (idx) { return function () { openItem(list, idx); }; })(j) });
      }
      if (from + PAGE < list.length) out.push({ label: "Mais >>", extra: (list.length - from - PAGE) + " restantes", go: function () { go("items/" + section + "/" + encodeURIComponent(cat) + "/" + (page + 1)); } });
      view(title, SECTION[section] + " &middot; " + list.length + " itens" + (page ? " &middot; pagina " + (page + 1) : ""), out);
    };
    if (state.lists[key]) return show(state.lists[key]);
    loadCatalog(function () {
      if (state.catalog.mode !== "xtream") {
        var out = [];
        for (var i = 0; i < state.m3u.length; i++) if (state.m3u[i].kind === section && state.m3u[i].group === cat) out.push(state.m3u[i]);
        return show(out);
      }
      app.innerHTML = '<h1>R<span>Tec</span></h1><p class="sub">Carregando...</p>';
      api("GET", "/api/player/xtream/items?section=" + section + "&category=" + encodeURIComponent(cat), null, function (err, data) {
        if (err) return err.status === 401 ? go("login") : message("", "Nao foi possivel carregar. " + esc(err.message), true);
        show(data || []);
      });
    });
  }

  // Serie: lista de episodios; filme e canal: toca direto.
  function openItem(list, idx) {
    var c = list[idx];
    if (c.kind === "series" && c.series_id) return go("series/" + encodeURIComponent(c.series_id) + "/" + encodeURIComponent(c.name));
    play(list, idx);
  }

  function series(id, name) {
    var key = "series|" + id;
    var show = function (eps) {
      state.lists[key] = eps;
      if (!eps.length) return message(name, "Nenhum episodio encontrado.");
      var out = [];
      for (var i = 0; i < eps.length; i++) {
        var e = eps[i];
        var label = (e.season ? "T" + e.season + " E" + e.episode + " - " : "") + e.name;
        out.push({ label: label, go: (function (j) { return function () { play(eps, j); }; })(i) });
      }
      view(name, eps.length + " episodios", out);
    };
    if (state.lists[key]) return show(state.lists[key]);
    app.innerHTML = '<h1>R<span>Tec</span></h1><p class="sub">Carregando episodios...</p>';
    api("GET", "/api/player/xtream/series/" + encodeURIComponent(id) + "?name=" + encodeURIComponent(name), null, function (err, data) {
      if (err) return message(name, "Nao foi possivel carregar. " + esc(err.message), true);
      show(data || []);
    });
  }

  // ---------- reprodutor (o da propria TV) ----------
  var playing = { list: null, idx: 0, tries: [], step: 0, timer: null, osdTimer: null };

  // Ordem de tentativa: HLS direto (o que as TVs antigas tocam melhor), o outro formato, e pelo servidor.
  function sources(c) {
    var out = [];
    if (c.type === "hls" && c.src) out.push(c.src);
    if (c.alt_type === "hls" && c.alt) out.push(c.alt);
    if (c.src && c.type !== "hls") out.push(c.src);
    if (c.alt && c.alt_type !== "hls") out.push(c.alt);
    if (c.fallback) out.push(c.fallback);
    return out;
  }

  function play(list, idx) {
    playing.list = list;
    playing.idx = idx;
    var c = list[idx];
    playing.tries = sources(c);
    playing.step = 0;
    app.style.display = "none";
    player.style.display = "block";
    perr.style.display = "none";
    showOsd(c.name, (c.group || "") + (list.length > 1 && c.kind === "live" ? " &middot; CH+/CH- ou setas para trocar" : ""));
    attempt();
  }

  function attempt() {
    clearTimeout(playing.timer);
    var url = playing.tries[playing.step];
    if (!url) return failed();
    try { video.src = url; video.load && video.load(); quietPlay(); } catch (e) { return next(); }
    playing.timer = setTimeout(next, 20000);
  }
  function next() { playing.step++; attempt(); }
  // Navegadores novos devolvem uma Promise no play(); a falha ja e tratada pelo evento "error".
  function quietPlay() { var r = video.play && video.play(); if (r && r["catch"]) r["catch"](function () {}); }

  if (video.addEventListener) {
    video.addEventListener("playing", function () { clearTimeout(playing.timer); perr.style.display = "none"; }, false);
    video.addEventListener("error", function () { if (player.style.display === "block") next(); }, false);
  }

  function failed() {
    clearTimeout(playing.timer);
    var c = playing.list[playing.idx];
    var direct = c.src;
    perr.innerHTML = '<p class="err">Este canal nao abriu na TV.</p>' +
      '<a href="#" class="f" id="pe1">Tentar de novo</a>' +
      '<a href="#" class="f" id="pe2">Abrir no reprodutor da TV</a>' +
      '<a href="#" class="f" id="pe3">Voltar</a>';
    perr.style.display = "block";
    document.getElementById("pe1").onclick = function () { play(playing.list, playing.idx); return false; };
    // Ultimo recurso: abre o link no proprio navegador/reprodutor da TV.
    document.getElementById("pe2").onclick = function () { location.href = direct; return false; };
    document.getElementById("pe3").onclick = function () { stop(); return false; };
    errFocus = 0;
    errMark();
  }
  var errFocus = 0;
  function errMark() {
    var l = perr.getElementsByTagName("a");
    for (var i = 0; i < l.length; i++) l[i].className = "f" + (i === errFocus ? " on" : "");
  }

  function showOsd(title, sub) {
    osd.innerHTML = esc(title) + (sub ? "<small>" + sub + "</small>" : "");
    osd.style.display = "block";
    clearTimeout(playing.osdTimer);
    playing.osdTimer = setTimeout(function () { osd.style.display = "none"; }, 5000);
  }

  function stop() {
    clearTimeout(playing.timer);
    try { video.pause(); video.removeAttribute("src"); video.load && video.load(); } catch (e) {}
    player.style.display = "none";
    app.style.display = "block";
    render();
  }

  function zap(step) {
    var l = playing.list;
    if (!l || l.length < 2) return;
    var c = l[playing.idx];
    if (c.kind !== "live" && !(c.kind === "series" && !c.series_id)) return;
    var n = playing.idx + step;
    if (c.kind === "live") n = (n + l.length) % l.length;
    if (n < 0 || n >= l.length) return;
    play(l, n);
  }

  function playerKey(code, e) {
    if (perr.style.display === "block") {
      var l = perr.getElementsByTagName("a");
      if (is("up", code) || is("left", code)) { errFocus = Math.max(0, errFocus - 1); errMark(); }
      else if (is("down", code) || is("right", code)) { errFocus = Math.min(l.length - 1, errFocus + 1); errMark(); }
      else if (is("enter", code)) l[errFocus].onclick();
      else if (is("back", code)) stop();
      return cancel(e);
    }
    var c = playing.list[playing.idx];
    if (is("back", code)) stop();
    else if (is("chup", code) || is("up", code)) zap(1);
    else if (is("chdown", code) || is("down", code)) zap(-1);
    else if (is("enter", code) || is("playpause", code)) { if (video.paused) quietPlay(); else video.pause(); showOsd(c.name, video.paused ? "Pausado" : ""); }
    else if (is("play", code)) quietPlay();
    else if (is("pause", code)) video.pause();
    else if ((is("left", code) || is("right", code)) && c.kind !== "live") {
      try { video.currentTime = Math.max(0, video.currentTime + (is("right", code) ? 30 : -10)); } catch (err) {}
      showOsd(c.name, Math.floor(video.currentTime / 60) + " min");
    } else showOsd(c.name, c.group || "");
    return cancel(e);
  }

  // ---------- informacoes (para o suporte) ----------
  function info() {
    var can = function (t) { try { return video.canPlayType ? (video.canPlayType(t) || "nao") : "sem video"; } catch (e) { return "erro"; } };
    var rows = [
      ["Navegador", navigator.userAgent],
      ["Tela", screen.width + " x " + screen.height],
      ["HLS", can("application/vnd.apple.mpegurl") + " / " + can("application/x-mpegURL")],
      ["MP4", can('video/mp4; codecs="avc1.42E01E, mp4a.40.2"')],
      ["MPEG-TS", can("video/mp2t")],
      ["JSON", window.JSON ? "sim" : "nao"]
    ];
    var h = "<table>";
    for (var i = 0; i < rows.length; i++) h += '<tr><td class="muted">' + rows[i][0] + "</td><td>" + esc(rows[i][1]) + "</td></tr>";
    message("Informacoes da TV", "Tire uma foto desta tela se o suporte pedir.");
    app.getElementsByTagName("p")[0].innerHTML += h + "</table>";
  }

  // ---------- roteador ----------
  function render() {
    var h = (location.hash || "").replace(/^#/, "");
    var parts = h.split("/");
    for (var i = 0; i < parts.length; i++) parts[i] = decodeURIComponent(parts[i]);
    if (parts[0] === "login") return loginScreen();
    if (parts[0] === "cats") return categories(parts[1]);
    if (parts[0] === "items") return items(parts[1], parts[2], Number(parts[3] || 0));
    if (parts[0] === "series") return series(parts[1], parts[2] || "");
    if (parts[0] === "info") return info();
    home();
  }

  // Abertura: confere se ja tem sessao (cookie) antes de pedir login.
  api("GET", "/api/player/me", null, function (err) {
    if (err && (err.status === 401 || err.status === 403)) {
      if (location.hash !== "#login") location.replace("#login");
      return loginScreen(err.status === 403 ? err.message : "");
    }
    render();
  });
})();
